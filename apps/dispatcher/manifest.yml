modules:
  jira:adminPage:
    - key: jec-event-bridge-configure-page
      title: Configure JEC Event Bridge
      render: native
      resource: admin-configure
      resolver:
        function: resolver
      useAsConfig: true
    - key: jec-event-bridge-get-started-page
      title: Get Started
      render: native
      resource: admin-get-started
      resolver:
        function: resolver
      useAsGetStarted: true
    - key: jec-event-bridge-admin-page
      title: JEC Event Bridge Status
      render: native
      resource: admin-page
      resolver:
        function: resolver
  scheduledTrigger:
    - key: jec-cleanup
      function: cleanup
      interval: hour
  function:
    - key: resolver
      handler: index.handler
    - key: cleanup
      handler: index.cleanup
  jira:globalPage:
    - key: jec-event-bridge-global-page
      title: JEC Event Bridge
      render: native
      resource: main
      resolver:
        function: resolver
resources:
  - key: main
    path: src/frontend/index.tsx
  - key: admin-configure
    path: src/frontend/admin-configure.tsx
  - key: admin-get-started
    path: src/frontend/admin-get-started.tsx
  - key: admin-page
    path: src/frontend/admin-page.tsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e4d5469f-2c1d-4a49-b666-4c28844f0e7f
permissions:
  scopes:
    storage:app: {}
    read:ops-config:jira-service-management:
      allowImpersonation: true
    write:ops-config:jira-service-management:
      allowImpersonation: true
    delete:ops-config:jira-service-management:
      allowImpersonation: true

[project]
name = "explore-forge-jira-edge-connector-receiver"
version = "0.0.0"
description = "On-premise JEC receiver assets — Python script and JEC configuration"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.11",
  "ty>=0.0.1a6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "ANN", # flake8-annotations
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
# ty reads Python source files from the project root by default.
# No additional configuration needed for a single-file project.
